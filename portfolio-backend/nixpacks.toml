[phases.install]
cmds = ["pip install -r requirements.txt"]

# Keine build-cmds, damit nichts Grosses ins Image kommt
# [phases.build]
# cmds = []

[start]
# Lade das Modell nur, wenn es noch nicht existiert, DANN starte uvicorn
cmd = "if [ ! -d \"$BGE_MODEL_PATH\" ] || [ -z \"$(ls -A \"$BGE_MODEL_PATH\" 2>/dev/null)\" ]; then python scripts/download_model.py; fi && uvicorn app.main:app --host 0.0.0.0 --port $PORT"