[phases.install]
cmds = ["pip install -r requirements.txt"]

[phases.build]
# Falls der Download im Build zu lange dauert/fehlschlägt, ersetze diese Zeile
# später durch nichts und führe den Download in [start] aus.
cmds = ["python scripts/download_model.py"]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"