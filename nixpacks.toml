[phases.setup]
nixPkgs = ["python311", "postgresql"]

[phases.install]
cmds = ["cd portfolio-backend && pip install -r requirements.txt"]

[phases.build]
cmds = ["cd portfolio-backend && python scripts/download_model.py"]

[start]
cmd = "cd portfolio-backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"